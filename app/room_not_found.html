<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room not found · Fibo Planner</title>
  <style>
    html, body { min-height: 100%; }
    body { display: flex; flex-direction: column; box-sizing: border-box; font-family: system-ui, sans-serif; max-width: 40rem; min-height: 100vh; margin: 0 auto; padding: 2rem 1rem; line-height: 1.5; }
    h1 { font-size: 1.5rem; }
    .crumb { font-size: 0.9rem; margin-bottom: 1rem; }
    .crumb a { color: #2563eb; }
    p { color: #444; }
    .copyright { 
      margin-top: auto;
      padding: 10px;
      width: 100%;
      text-align: center;
      background: #f5f5f5;
      border-top: 1px solid #ccc;
    }
    .copyright a { color: #2563eb; }
  </style>
</head>
<body>
  <p class="crumb"><a href="/">Fibo Planner</a> · Room</p>
  <h1>Room does not exist</h1>
  <p>There is no room <strong>{{.RoomID}}</strong>. It may have been removed after everyone left, or the link may be wrong.</p>
  <p><a href="/">Create or open a room from the home page</a></p>
  {{template "site-footer"}}
</body>
</html>
